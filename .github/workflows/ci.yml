
name: CI Lab4

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push 3 Docker images
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          OWNER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')

          for part in api frontend migrate; do
            if [ "$part" = "frontend" ]; then
              context=frontend
              dockerfile=frontend/Dockerfile
            elif [ "$part" = "migrate" ]; then
              context=backend
              dockerfile=backend/Dockerfile.migrate
            else
              context=backend
              dockerfile=backend/Dockerfile
            fi

            IMAGE="ghcr.io/$OWNER/$REPO-$part"

            echo "Building $IMAGE"

            docker build \
              -f "$dockerfile" \
              -t "$IMAGE:${GITHUB_SHA}" \
              -t "$IMAGE:latest" \
              "$context"

            if [ "$EVENT_NAME" != "pull_request" ]; then
              docker push "$IMAGE:${GITHUB_SHA}"

              if [ "$GITHUB_REF" = "refs/heads/main" ]; then
                docker push "$IMAGE:latest"
              fi
            fi
          done

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: |
          helm lint k8s/webapp

      - name: Render Helm templates
        run: |
          helm template lab k8s/webapp > rendered.yaml

      - name: Package Helm chart
        run: |
          mkdir -p dist
          helm package k8s/webapp --destination dist

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz
