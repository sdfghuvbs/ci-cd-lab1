name: Reusable Docker build and publish

on:
  workflow_call:
    inputs:
      image_repository:
        description: 'Docker Hub namespace/repository'
        required: true
        type: string
      image_tag:
        description: 'Docker image tag'
        required: true
        type: string
      publish:
        description: 'Push to Docker Hub when true, upload artifact otherwise'
        required: true
        type: boolean
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image on main
        if: inputs.publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ inputs.image_repository }}:${{ inputs.image_tag }}
      - name: Build image on non-main branches
        if: ${{ !inputs.publish }}
        run: docker build -t "${{ inputs.image_repository }}:${{ inputs.image_tag }}" .
      - name: Save image as tar archive
        if: ${{ !inputs.publish }}
        run: docker save -o docker-image.tar "${{ inputs.image_repository }}:${{ inputs.image_tag }}"
      - name: Upload Docker image artifact
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.run_id }}
          path: docker-image.tar
          retention-days: 7
