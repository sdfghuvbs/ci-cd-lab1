<!doctype html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ЛР4 — Список записів</title><style>body{font-family:system-ui;max-width:780px;margin:50px auto;padding:0 18px;color:#202a36}form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}input{padding:10px;border:1px solid #bbb;border-radius:6px}button{padding:10px;border:0;border-radius:6px;background:#2359b5;color:white;cursor:pointer}li{margin:12px 0;padding:10px;background:#f2f5fa;border-radius:6px}li button{margin-left:8px}#error{color:#c00}</style></head><body><h1>Каталог записів</h1><p>Frontend + FastAPI + PostgreSQL + Kubernetes + Helm</p><form id="form"><input id="name" placeholder="Назва" required maxlength="150"><input id="description" placeholder="Опис" maxlength="500"><button type="submit">Додати</button></form><p id="error"></p><ul id="list"></ul><script>
const base='/api/items';const error=document.getElementById('error');
async function request(url,options){const r=await fetch(url,options);if(!r.ok)throw Error(await r.text());if(r.status!==204)return r.json()}
async function load(){try{error.textContent='';const items=await request(base);const list=document.getElementById('list');list.replaceChildren();for(const x of items){const li=document.createElement('li');const label=document.createElement('span');label.textContent=x.name+' — '+x.description;const edit=document.createElement('button');edit.textContent='Редагувати';edit.onclick=async()=>{const name=prompt('Назва',x.name);if(name===null||!name.trim())return;const description=prompt('Опис',x.description);if(description===null)return;try{await request(base+'/'+x.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,description})});await load()}catch(e){error.textContent=e.message}};const del=document.createElement('button');del.textContent='Видалити';del.onclick=async()=>{if(!confirm('Видалити запис?'))return;try{await request(base+'/'+x.id,{method:'DELETE'});await load()}catch(e){error.textContent=e.message}};li.append(label,edit,del);list.append(li)}}catch(e){error.textContent=e.message}}
document.getElementById('form').onsubmit=async e=>{e.preventDefault();try{await request(base,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value,description:document.getElementById('description').value})});e.target.reset();await load()}catch(e){error.textContent=e.message}};load();
</script></body></html>
