apiVersion: v1
kind: Secret
metadata:
  name: lab-db-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@lab-db:5432/%s" .Values.postgres.user (.Values.postgres.password | urlquery) .Values.postgres.database | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: lab-db
spec:
  clusterIP: None
  selector:
    app: lab-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lab-db
spec:
  serviceName: lab-db
  replicas: 1
  selector:
    matchLabels: {app: lab-db}
  template:
    metadata:
      labels: {app: lab-db}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: lab-db-secret, key: POSTGRES_PASSWORD}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - {name: pgdata, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migration-{{ .Release.Revision }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: "{{ .Values.migration.image }}:{{ .Values.migration.tag }}"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: lab-db-secret, key: DATABASE_URL}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {app: lab-api}
  template:
    metadata:
      labels: {app: lab-api}
    spec:
      initContainers:
        - name: wait-db
          image: {{ .Values.postgres.image | quote }}
          command: ["sh", "-c", "until pg_isready -h lab-db -U {{ .Values.postgres.user }} -d {{ .Values.postgres.database }}; do sleep 2; done"]
      containers:
        - name: api
          image: "{{ .Values.api.image }}:{{ .Values.api.tag }}"
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: lab-db-secret, key: DATABASE_URL}
          readinessProbe:
            httpGet: {path: /api/health, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: lab-api
spec:
  selector: {app: lab-api}
  ports:
    - {port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: {app: lab-frontend}
  template:
    metadata:
      labels: {app: lab-frontend}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: lab-frontend
spec:
  selector: {app: lab-frontend}
  ports:
    - {port: 80, targetPort: 80}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lab-webapp
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: lab-api
                port: {number: 8080}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lab-frontend
                port: {number: 80}
{{- end }}
